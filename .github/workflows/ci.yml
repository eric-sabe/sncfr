name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  docs-check:
    name: Verify Spec & Plan Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required living documentation files exist
        run: |
          for f in AGENTS.md README.md docs/SPEC.md docs/PLAN.md; do
            if [ ! -s "$f" ]; then
              echo "Missing or empty required documentation file: $f"
              exit 1
            fi
          done

  rust:
    name: Rust Format, Clippy & Test
    runs-on: ubuntu-latest
    if: hashFiles('Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (libdbus for keyring on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features
